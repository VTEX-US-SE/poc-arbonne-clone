extend type Query {
  """
  One consultant's public storefront profile, by their Arbonne ID. `null` when
  no consultant matches.
  """
  arbSponsor(arbonneId: String!): ArbSponsor
  """
  The consultant the signed-in shopper is already bound to, from their own `CL`
  record. Takes no argument on purpose: the shopper is identified from their auth
  cookie, so this cannot be pointed at anyone else. `null` when signed out or
  unbound.
  """
  arbSponsorOfRecord: ArbSponsor
}

"""
The subset of a Sponsors List row a storefront visitor may see. Deliberately
omits `userId`, which is the customer's CL document id.
"""
type ArbSponsor {
  arbonneId: String
  displayName: String
  displayDescription: String
  profilePicture: String
  desktopImage: String
  mobileImage: String
  displayCollection: String
}
