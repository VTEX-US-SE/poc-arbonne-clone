type ArbAgentMessage {
  id: ID!
  direction: String!
  text: String!
  createdOn: String
  attachments: [String!]!
}

extend type Query {
  arbAgentMessages(urn: String!): [ArbAgentMessage!]!
}

extend type Mutation {
  arbSendAgentMessage(
    from: String!
    message: String!
    contactName: String
  ): Boolean!
}
